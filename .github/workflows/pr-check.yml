name: PR Check

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the validated image to GHCR (main branch only)
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - edited
      - reopened
      - synchronize
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency Security
    uses: ./.github/workflows/security.yml

  changes:
    name: Scope
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      manager_server: ${{ steps.classify.outputs.manager_server }}
      windows_sqlite: ${{ steps.classify.outputs.windows_sqlite }}
      native_control: ${{ steps.classify.outputs.native_control }}
      docker: ${{ steps.classify.outputs.docker }}
      demo_docs: ${{ steps.classify.outputs.demo_docs }}
      release_content: ${{ steps.classify.outputs.release_content }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          changed_files="${RUNNER_TEMP}/pr-check-changed-files.bin"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            # An empty path list selects every check for an explicit CI run.
            : > "${changed_files}"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --no-renames -z "${PR_BASE_SHA}...${PR_HEAD_SHA}" > "${changed_files}"
          elif [ -z "${PUSH_BEFORE_SHA}" ] || [[ "${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
            git show --pretty=format: --name-only --no-renames -z "${CURRENT_SHA}" > "${changed_files}"
          else
            git diff --name-only --no-renames -z "${PUSH_BEFORE_SHA}..${CURRENT_SHA}" > "${changed_files}"
          fi

          echo "Changed files:"
          while IFS= read -r -d '' file_path; do
            printf -- '- %q\n' "${file_path}"
          done < "${changed_files}"
          node bin/ci/classify-pr-checks.mjs --null < "${changed_files}" >> "${GITHUB_OUTPUT}"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm --workspace apps/web run build:bundle
        env:
          VERSION: ci

      - name: Check demo isolation
        run: npm run check:demo-isolation

      - name: Check web icon artifact
        run: npm run check:web-icons

  manager-server:
    name: Manager Server
    needs: changes
    if: needs.changes.outputs.manager_server == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-test-password
          MYSQL_DATABASE: cpamp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/manager-server/go.mod
          cache-dependency-path: apps/manager-server/go.sum

      - name: Check MySQL schema compatibility
        working-directory: apps/manager-server
        env:
          CPA_TEST_MYSQL_DSN: root:integration-test-password@tcp(127.0.0.1:3306)/cpamp_test
        run: go test -p 1 -count=1 -v ./internal/repository/mysql -run '^TestMySQLHourlyDefaultMetadataRoundTrip$'

      - name: Test
        working-directory: apps/manager-server
        run: go test ./...

      - name: Test MySQL integration
        env:
          CPA_TEST_MYSQL_DSN: root:integration-test-password@tcp(127.0.0.1:3306)/cpamp_test
        run: bash bin/ci/test-mysql.sh

      - name: Test MySQL process and server crash recovery
        run: bash bin/ci/test-mysql-recovery.sh

      - name: Check generated MySQL schema
        working-directory: apps/manager-server
        run: |
          go generate ./internal/repository/mysql
          git diff --exit-code -- internal/repository/mysql/schema.sql

  manager-server-windows-sqlite:
    name: Manager Server SQLite (Windows)
    needs: changes
    if: needs.changes.outputs.windows_sqlite == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/manager-server/go.mod
          cache-dependency-path: apps/manager-server/go.sum

      - name: Test SQLite repository
        working-directory: apps/manager-server
        run: go test ./internal/repository/sqlite

  native-control:
    name: Native Control (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.native_control == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test native control scripts
        run: npx vitest run tests/nativeControlScripts.test.mjs

      - name: Validate native packaging script syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n bin/release/package-native.sh

  docker-build:
    name: Build and publish Manager image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - security
      - changes
      - frontend
      - manager-server
    if: >-
      always() &&
      needs.security.result == 'success' &&
      needs.changes.outputs.docker == 'true' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs['manager-server'].result == 'success' || needs['manager-server'].result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image publication
        id: image
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish_image }}
        run: |
          set -euo pipefail
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$PUBLISH_REQUESTED" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo 'Image publication is restricted to main.' >&2
              exit 1
            fi
            publish=true
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Validate deployment manifests
        env:
          MYSQL_ROOT_PASSWORD: ci-configuration-only
          MYSQL_PASSWORD: ci-configuration-only
        run: |
          docker compose -f docker-compose.manager.yml config --quiet
          docker compose -f docker-compose.mysql.yml config --quiet
          docker run --rm -v "$GITHUB_WORKSPACE/deploy/k3s:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary \
            /manifests/cpa-manager-plus.yaml /manifests/secrets.example.yaml

      - name: Build image for runtime smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.manager-server
          platforms: linux/amd64
          load: true
          push: false
          tags: cpamp-image-test:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=cpamp-image

      - name: Smoke test image with MySQL
        env:
          CPAMP_EXPECTED_REVISION: ${{ github.sha }}
        run: bash bin/ci/smoke-manager-image.sh "cpamp-image-test:$GITHUB_SHA"

      - name: Log in to GHCR
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build both architectures and publish eligible images
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.manager-server
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.image.outputs.publish == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=cpamp-image
          cache-to: type=gha,mode=max,scope=cpamp-image

      - name: Record published image
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST" --raw > image-manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' image-manifest.json
          mkdir -p artifacts
          jq -n --arg image "$IMAGE_NAME" --arg digest "$IMAGE_DIGEST" --arg source "$GITHUB_SHA" \
            '{image:$image,digest:$digest,source:$source,platforms:["linux/amd64","linux/arm64"]}' > artifacts/image.json
          printf 'CPAMP_IMAGE=%s@%s\n' "$IMAGE_NAME" "$IMAGE_DIGEST" > artifacts/image.env
          printf 'Published `%s@%s` from `%s`.\n' "$IMAGE_NAME" "$IMAGE_DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image receipt
        if: steps.image.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manager-image-${{ github.sha }}
          path: artifacts/image.*
          retention-days: 7
          if-no-files-found: error

  demo-docs:
    name: Demo and Docs
    needs: changes
    if: needs.changes.outputs.demo_docs == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo site
        run: npm --workspace apps/web run build:demo:bundle
        env:
          VERSION: ci-demo

      - name: Build docs site
        run: npm run docs:build

  release-content:
    name: Release Content
    needs: changes
    if: needs.changes.outputs.release_content == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Validate changed release content
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          changed_files="${RUNNER_TEMP}/release-content-changed-files.bin"
          validation_json="${RUNNER_TEMP}/release-content-validation.json"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --no-renames --diff-filter=A -z "${PR_BASE_SHA}...${PR_HEAD_SHA}" > "${changed_files}"
          elif [ -z "${PUSH_BEFORE_SHA}" ] || [[ "${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
            git show --pretty=format: --name-only --no-renames --diff-filter=A -z "${CURRENT_SHA}" > "${changed_files}"
          else
            git diff --name-only --no-renames --diff-filter=A -z "${PUSH_BEFORE_SHA}..${CURRENT_SHA}" > "${changed_files}"
          fi

          npm run --silent release:validate -- --changed-content --null < "${changed_files}" > "${validation_json}"
          cat "${validation_json}"

          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${PR_BASE_REF}" = "dev" ]; then
            while IFS= read -r release_tag; do
              if [ -z "${release_tag}" ]; then
                continue
              fi
              node bin/release/validate-release-contributors.mjs \
                --tag "${release_tag}" \
                --source-sha "${PR_BASE_SHA}"
            done < <(jq -r '.tags[]' "${validation_json}")
          fi

  required:
    name: Required checks
    needs:
      - security
      - changes
      - frontend
      - manager-server
      - manager-server-windows-sqlite
      - native-control
      - docker-build
      - demo-docs
      - release-content
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify applicable checks
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MANAGER_SERVER_RESULT: ${{ needs['manager-server'].result }}
          WINDOWS_SQLITE_RESULT: ${{ needs['manager-server-windows-sqlite'].result }}
          NATIVE_CONTROL_RESULT: ${{ needs['native-control'].result }}
          DOCKER_BUILD_RESULT: ${{ needs['docker-build'].result }}
          DEMO_DOCS_RESULT: ${{ needs['demo-docs'].result }}
          RELEASE_CONTENT_RESULT: ${{ needs['release-content'].result }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${SECURITY_RESULT}" != "success" ]; then
            echo "Dependency Security did not complete successfully: ${SECURITY_RESULT:-missing}" >&2
            exit 1
          fi
          echo "Dependency Security: ${SECURITY_RESULT}"

          results=(
            "Scope:${CHANGES_RESULT}"
            "Frontend:${FRONTEND_RESULT}"
            "Manager Server:${MANAGER_SERVER_RESULT}"
            "Manager Server SQLite (Windows):${WINDOWS_SQLITE_RESULT}"
            "Native Control:${NATIVE_CONTROL_RESULT}"
            "Docker Build:${DOCKER_BUILD_RESULT}"
            "Demo and Docs:${DEMO_DOCS_RESULT}"
            "Release Content:${RELEASE_CONTENT_RESULT}"
          )

          for check in "${results[@]}"; do
            name="${check%%:*}"
            result="${check#*:}"
            case "${result}" in
              success|skipped)
                echo "${name}: ${result}"
                ;;
              *)
                echo "${name} did not complete successfully: ${result:-missing}" >&2
                exit 1
                ;;
            esac
          done
