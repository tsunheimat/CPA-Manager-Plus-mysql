# Copy to secrets.yaml, replace every CHANGE_ME value, and keep that copy private.
apiVersion: v1
kind: Namespace
metadata:
  name: cpamp
---
apiVersion: v1
kind: Secret
metadata:
  name: cpamp-credentials
  namespace: cpamp
type: Opaque
stringData:
  mysql-root-password: CHANGE_ME_RANDOM_ROOT_PASSWORD
  mysql-password: CHANGE_ME_RANDOM_APP_PASSWORD
  admin-key: CHANGE_ME_RANDOM_ADMIN_KEY
